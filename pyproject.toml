[project]
name = "heartline"
version = "0.1.0"
description = "카카오톡 대화 AI 분석 연애 코칭 서비스"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.0",
    "pyjwt[crypto]>=2.0",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "alembic>=1.18.4",
    "email-validator>=2.3.0",
    "aiofiles>=25.1.0",
    "arq>=0.27.0",
    "redis>=5.3.1",
    "easyocr>=1.7.2",
    "opencv-python-headless>=4.13.0.92",
    "httpx>=0.28.1",
    "google-genai>=1.72.0",
]

[tool.fastapi]
entrypoint = "backend.app.main:app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
