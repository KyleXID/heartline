[project]
name = "heartline"
version = "0.1.0"
description = "카카오톡 대화 AI 분석 연애 코칭 서비스"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.0",
    "pyjwt[crypto]>=2.0",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
]

[tool.fastapi]
entrypoint = "backend.app.main:app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
